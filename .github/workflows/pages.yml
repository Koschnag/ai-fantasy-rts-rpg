name: Deploy research showcase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - .ai/tasks/T-010-native-walking-skeleton.json
      - BACKLOG.md
      - docs/showcase/**
      - scripts/build-pages.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public status artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build dependency-free showcase
        run: ./scripts/build-pages.sh _site

      - name: Assert publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/status.json
          if find _site -type f -path '*/quarantine/*' -print -quit | grep -q .; then
            printf '%s\n' 'Quarantaenedatei im Pages-Artefakt.' >&2
            exit 1
          fi
          grep -q 'CONCEPT · NOT GAMEPLAY' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
