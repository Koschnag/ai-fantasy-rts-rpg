name: Deploy research showcase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - .ai/tasks/**
      - BACKLOG.md
      - docs/showcase/**
      - scripts/build-pages.sh
      - scripts/pages_status.py
      - scripts/test-pages.py
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - .ai/tasks/**
      - BACKLOG.md
      - docs/showcase/**
      - scripts/build-pages.sh
      - scripts/pages_status.py
      - scripts/test-pages.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify reproducible public artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve optional public WIP provenance
        id: wip
        shell: bash
        run: |
          set -euo pipefail
          wip_line=$(git ls-remote --heads origin refs/heads/autopilot/live-wip || true)
          if [[ -z "$wip_line" ]]; then
            exit 0
          fi
          wip_commit=${wip_line%%[[:space:]]*}
          if [[ ! "$wip_commit" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Ungueltige oeffentliche WIP-Referenz.' >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin refs/heads/autopilot/live-wip:refs/remotes/origin/autopilot/live-wip
          test "$(git rev-parse refs/remotes/origin/autopilot/live-wip)" = "$wip_commit"
          wip_committed_at=$(git show -s --format=%cI "$wip_commit")
          printf 'commit=%s\n' "$wip_commit" >> "$GITHUB_OUTPUT"
          printf 'committed_at=%s\n' "$wip_committed_at" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build dependency-free showcase twice
        shell: bash
        env:
          PAGES_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PAGES_WIP_COMMIT: ${{ steps.wip.outputs.commit }}
          PAGES_WIP_COMMITTED_AT: ${{ steps.wip.outputs.committed_at }}
        run: |
          set -euo pipefail
          ./scripts/build-pages.sh _site-a
          ./scripts/build-pages.sh _site-b
          diff -ru --no-dereference _site-a _site-b
          mv _site-a _site
          rm -rf -- _site-b

      - name: Check public links and contracts
        run: python3 scripts/test-pages.py --source docs/showcase --built _site --external-links

      - name: Assert publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/status.json
          if find _site -type f -path '*/quarantine/*' -print -quit | grep -q .; then
            printf '%s\n' 'Quarantaenedatei im Pages-Artefakt.' >&2
            exit 1
          fi
          grep -q 'CONCEPT · NOT GAMEPLAY' _site/index.html
          grep -q 'Kontinuitätssnapshot, kein akzeptierter Fortschritt' _site/index.html
          test -f _site/publication-hashes.sha256

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
