name: Deploy research showcase

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedule is best effort only: nominally every 15 minutes, with no
    # exact start-time, availability, interval, or 24/7 guarantee.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: riftward-pages-trusted-main
  cancel-in-progress: true

jobs:
  build:
    name: Build trusted public observation
    if: github.repository_id == '1333151301' && github.repository == 'Koschnag/ai-fantasy-rts-rpg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Resolve exact public main
        id: main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '[.id,.full_name,.default_branch] | @tsv')
          test "$repository" = $'1333151301\tKoschnag/ai-fantasy-rts-rpg\tmain'
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          main_tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${main_sha}" --jq '.tree.sha')
          [[ "$main_tree" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == push ]]; then
            test "$EVENT_SHA" = "$main_sha"
          fi
          printf 'sha=%s\ntree=%s\n' "$main_sha" "$main_tree" >> "$GITHUB_OUTPUT"

      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.main.outputs.sha }}

      - name: Bind checkout and workflow to main
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.main.outputs.sha }}
          EXPECTED_TREE: ${{ steps.main.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          remote_main=$(git ls-remote --heads origin refs/heads/main)
          test "${remote_main%%[[:space:]]*}" = "$EXPECTED_SHA"
          workflow_blob=$(git rev-parse "HEAD:.github/workflows/pages.yml")
          [[ "$workflow_blob" =~ ^[0-9a-f]{40}$ ]]

      - name: Reconcile historical promotion evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          MAIN_TREE: ${{ steps.main.outputs.tree }}
        run: |
          set -euo pipefail
          pages_temp=$(mktemp -d "${RUNNER_TEMP}/riftward-pages.XXXXXX")
          verdict="$pages_temp/reconciliation-verdict.json"
          python3 scripts/validate_reconciliation.py --manifest docs/showcase/reconciliation.json --root . --live-github --main-sha "$MAIN_SHA" --main-tree "$MAIN_TREE" --verdict-out "$verdict"
          printf 'PAGES_TEMP=%s\nPAGES_RECONCILIATION_VERDICT=%s\n' "$pages_temp" "$verdict" >> "$GITHUB_ENV"

      - name: Observe allowlisted GitHub data
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          MAIN_TREE: ${{ steps.main.outputs.tree }}
        run: |
          set -euo pipefail
          observed_at=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          observation="$PAGES_TEMP/github-observation.json"
          python3 scripts/pages_github_observation.py --main-sha "$MAIN_SHA" --main-tree "$MAIN_TREE" --observed-at "$observed_at" --output "$observation"
          printf 'PAGES_OBSERVED_AT=%s\nPAGES_GITHUB_OBSERVATION=%s\n' "$observed_at" "$observation" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build dependency-free showcase twice
        shell: bash
        env:
          PAGES_SOURCE_BRANCH: main
        run: |
          set -euo pipefail
          ./scripts/build-pages.sh "$PAGES_TEMP/site-a"
          ./scripts/build-pages.sh "$PAGES_TEMP/site-b"
          diff -ru --no-dereference "$PAGES_TEMP/site-a" "$PAGES_TEMP/site-b"

      - name: Check public contracts
        run: |
          python3 scripts/test-reconciliation.py
          python3 scripts/test-pages.py --source docs/showcase --built "$PAGES_TEMP/site-a" --trusted-current-time "$PAGES_OBSERVED_AT" --external-links

      - name: Recheck main ref before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          test "$current_sha" = "$EXPECTED_SHA"
          test -f "$PAGES_TEMP/site-a/status.json"
          test -f "$PAGES_TEMP/site-a/status.svg"
          test -f "$PAGES_TEMP/site-a/task.svg"
          test -f "$PAGES_TEMP/site-a/publication-hashes.sha256"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.PAGES_TEMP }}/site-a

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.repository_id == '1333151301' && github.repository == 'Koschnag/ai-fantasy-rts-rpg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
