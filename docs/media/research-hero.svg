<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Project Riftward – AI-native game engineering research</title>
  <desc id="desc">An original abstract landscape connects exploration, community building and strategy under an evidence graph.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.55" stop-color="#17283a"/>
      <stop offset="1" stop-color="#314356"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#384958"/>
      <stop offset="1" stop-color="#111a20"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7d8b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9cc8cf" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e59a47" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f0b35e"/>
      <stop offset="1" stop-color="#ffd38b" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

